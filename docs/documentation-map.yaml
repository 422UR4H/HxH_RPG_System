        confidence: directly_affected
      - path: docs/game/combate/reacoes.md
        confidence: possibly_affected
    notes: >-
      Estado de combate do personagem — as DUAS barras (ActionBar e MoveBar, ambas
      ResourceBar), o ModifierLedger de bônus e penalidades acumulados (bônus é
      específico do alvo; penalidade é geral; ambos em actionSpeed, nunca em acerto)
