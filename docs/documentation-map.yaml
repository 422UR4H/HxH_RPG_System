      entra: as posições vivem no Room, alcançadas por PiecePositionSource. A
      aritmética de fechamento das barras chegou na Fase 3 — ver service.BarEconomy.

  - code_path: internal/domain/match/resource_bar.go
    dev_docs:
      - path: docs/dev/match/combat-engine.md
        confidence: directly_affected
    notes: >-
      ResourceBar é a forma das DUAS barras (ActionBar e MoveBar, dentro de
      CharacterStatus): Balance (saldo que carrega entre rounds) e Speeds (histórico
      das velocidades roladas no round corrente). Fase 1 só definiu a forma — a
      aritmética de fechamento do round (média, preço, teto, carry-over) chegou na
      Fase 3, em service.BarEconomy e service.RoundScheduler.

  - code_path: internal/domain/match/entity/action/roll_condition.go
    dev_docs:
