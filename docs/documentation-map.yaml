        confidence: directly_affected
    notes: >-
      Struct DO MESTRE — Bias são os dados (vantagem/desvantagem), Modifier é o
      ajuste manual. A diferença acumulada do sistema NÃO mora aqui: mora no
      ModifierLedger dentro do CharacterStatus, com AgainstID, ExpiresAt e Source.
      O RollCalculator soma os dois vieses ao derivar o resultado.

