        confidence: directly_affected
    notes: >-
      Deixou de ser heap na Fase 3: virou lista simples, em ordem de inserção. A
      chave de uma ação pendente é estado do personagem (a média do round se move
      sob ela), não da action, e um heap não re-chaveia item já inserido — a
      ordenação passou para service.RoundScheduler, calculada na hora da seleção.
      flows/05-lacunas.md §2 (resolvido na Fase 3).

