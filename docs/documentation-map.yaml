      action e vivem em RollCheck.Attempts; ele deriva e nunca rola. O dano é
      projetado (dry-run) e só é aplicado no fechamento do turno. Com vários alvos
      será uma CADEIA sequencial, não um lote (Fase 4): o estado do ataque sai
      alterado de cada resolução e entra na próxima, e a ordem em que o mestre abre
      muda o resultado. Escada de margem com degrau padrão de 10.


