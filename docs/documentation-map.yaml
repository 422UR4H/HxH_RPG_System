        confidence: directly_affected
    notes: >-
      Aritmética de uma barra, stateless: Mean (float64, nunca trunca), Balance,
      Key (só ordena) e IsEligible (os DOIS porteiros — primeira ação contra a
      barra, segunda em diante contra o troco), CloseBalance (carry-over com teto).
