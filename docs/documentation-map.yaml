      do catálogo. A subtração de defesa é CONDICIONAL (só se o alvo defendeu) e é a
      forma INICIAL do aparar, não uma provisória — o que falta é o entorno: tipos de
      dano, armadura e Nen. A margem do acerto NÃO entra no dano, por decisão de
      produto. Hoje toda arma do catálogo tem defense 0, então a subtração é inerte.

  - code_path: internal/domain/match/service/margin_ladder.go
    dev_docs:
      - path: docs/dev/match/combat-engine.md
        confidence: directly_affected
    game_docs:
      - path: docs/game/combate/reacoes.md
        confidence: directly_affected
    notes: >-
      A escada de margem como função pura, sem nenhuma reação ligada nela (Fase 2).
      A forma da escada fica em código; só o degrau é regra de partida
      (MatchRules.LadderStep). Empate favorece o defensor. A Fase 4 liga o repelir.

